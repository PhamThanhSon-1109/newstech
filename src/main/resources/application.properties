spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=newstech;encrypt=false;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.data.web.pageable.serialization-mode=via-dto

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Thu muc luu file upload (duong dan tuyet doi, de khong bi mat khi deploy JAR)
upload.dir=${user.home}/newstech-uploads

# JWT Secret (>= 32 ky tu UTF-8 = 256-bit)
jwt.secret=newstech-super-secret-key-must-be-at-least-256bit

# Bat buoc tieng Viet utf-8 de khong bi loi text / view index.html thanh dau hoi
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true