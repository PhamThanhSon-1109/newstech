<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>So sánh Phần cứng - TechPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .compare-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 32px;
        }

        @media (max-width: 768px) {
            .compare-layout {
                grid-template-columns: 1fr;
            }
        }

        .hardware-select {
            background: var(--surface-alt);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
            appearance: none;
        }

        .hardware-select:focus, .hardware-select:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap::after {
            content: '\f107';
            font-family: 'FontAwesome';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cyan);
            pointer-events: none;
        }

        .vs-badge {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            background: var(--cyan);
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 16px;
            z-index: 10;
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        .spec-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
        }

        .spec-table th, .spec-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .spec-table th {
            background: var(--surface-alt);
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .spec-table td {
            font-size: 16px;
            font-weight: 500;
        }

        .spec-table tr:last-child td {
            border-bottom: none;
        }

        .spec-label {
            text-align: left !important;
            font-weight: 600 !important;
            color: var(--text-muted);
            width: 25%;
        }

        .winner {
            color: #10b981;
            font-weight: 700 !important;
            background: rgba(16, 185, 129, 0.1);
        }

        .loser {
            color: #ef4444;
            opacity: 0.8;
        }

        .neutral {
            color: var(--text);
        }
    </style>
</head>

<body>
    <header class="tp-header" id="header">
        <div class="tp-container header-inner">
            <a href="index.html" class="logo">Tech<span>Pulse</span></a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Trang chủ</a>
                <a href="compare.html" class="nav-link active" style="display:flex;align-items:center;gap:6px"><i class="fa-solid fa-code-compare"></i> So sánh</a>
                <div class="nav-categories" id="nav-categories"></div>
            </nav>
            <div class="header-actions">
                <div id="auth-buttons"></div>
                <button class="hamburger" id="hamburger-btn" onclick="toggleMobileNav()"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <main class="tp-container" style="padding-top:40px;padding-bottom:80px;min-height:75vh">
        <div style="text-align:center;margin-bottom:40px">
            <h1 class="outfit" style="font-size:40px;font-weight:800;background:linear-gradient(to right,var(--cyan),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">So sánh Phần cứng</h1>
            <p style="color:var(--text-muted);margin-top:10px">Chọn 2 linh kiện để đối chiếu thông số kỹ thuật chi tiết.</p>
        </div>

        <div style="position:relative;background:var(--surface);padding:40px;border-radius:32px;border:1px solid var(--border);box-shadow:0 20px 40px rgba(0,0,0,0.2)">
            <div class="vs-badge">VS</div>
            
            <div class="compare-layout">
                <div class="select-wrap">
                    <select id="hw1" class="hardware-select" onchange="renderComparison()">
                        <option value="">Chọn linh kiện 1...</option>
                    </select>
                </div>
                <div class="select-wrap">
                    <select id="hw2" class="hardware-select" onchange="renderComparison()">
                        <option value="">Chọn linh kiện 2...</option>
                    </select>
                </div>
            </div>

            <table class="spec-table" id="spec-table" style="display:none">
                <thead>
                    <tr>
                        <th style="text-align:left">Thông số</th>
                        <th id="th1">Linh kiện 1</th>
                        <th id="th2">Linh kiện 2</th>
                    </tr>
                </thead>
                <tbody id="spec-body">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
            
            <div id="empty-state" style="text-align:center;padding:60px 0;color:var(--text-muted)">
                <i class="fa-solid fa-microchip" style="font-size:48px;margin-bottom:20px;opacity:0.2"></i>
                <p>Vui lòng chọn đủ 2 linh kiện để bắt đầu so sánh.</p>
            </div>
        </div>
    </main>

    <footer class="tp-footer">
        <div class="tp-container footer-inner">
            <div class="footer-brand">
                <a class="logo footer-logo" href="index.html">Tech<span>Pulse</span></a>
                <p>Nền tảng tin tức công nghệ đáng tin cậy tại Việt Nam.</p>
            </div>
        </div>
        <div class="footer-bottom">© 2026 TechPulse. All rights reserved.</div>
    </footer>

    <script src="common.js"></script>
    <script src="compare.js"></script>
    <script>
        // Auth area
        renderHeader('auth-buttons');

        async function loadCategories() {
            try {
                const r = await api.get('/categories');
                const cats = r.data || [];
                document.getElementById('nav-categories').innerHTML = cats.slice(0, 5).map(c =>
                    `<a href="category.html?slug=${c.slug}&name=${encodeURIComponent(c.name)}" class="nav-link">${c.name}</a>`
                ).join('');
            } catch (e) { }
        }
        loadCategories();
    </script>
</body>
</html>
