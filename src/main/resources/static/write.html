<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viết bài - TechPulse Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- TinyMCE CDN is blocked in simple apps sometimes, we'll build a basic plain text or generic editor layout -->
</head>

<body style="background:var(--bg);color:var(--text)">
    <header
        style="background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between">
        <a href="admin.html"
            style="font-size:13px;color:var(--text-muted);text-decoration:none;display:flex;align-items:center;gap:8px">
            <i class="fa-solid fa-arrow-left"></i> Về trang quản trị
        </a>
        <h1 class="outfit" style="font-size:16px;font-weight:700" id="page-title">Viết bài mới</h1>
        <div></div>
    </header>

    <main class="tp-container" style="max-width:900px;padding:32px 20px">
        <div class="card rounded-2xl" auto>
            <input type="hidden" id="post-id">

            <div style="margin-bottom:20px">
                <label
                    style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">Tiêu
                    đề bài viết</label>
                <input type="text" id="p-title" class="tp-input" placeholder="Nhập tiêu đề hấp dẫn..."
                    style="font-size:16px;font-weight:600" oninput="genSlug()">
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
                <div>
                    <label
                        style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">Chuyên
                        mục</label>
                    <select id="p-cat" class="tp-input" style="cursor:pointer">
                        <option value="">Chọn chuyên mục</option>
                    </select>
                </div>
                <div>
                    <label
                        style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">Slug
                        URL</label>
                    <input type="text" id="p-slug" class="tp-input" placeholder="tao-slug-tu-dong-or-custom">
                </div>
            </div>

            <div style="margin-bottom:20px">
                <label
                    style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">Tóm
                    tắt (Trích dẫn)</label>
                <textarea id="p-excerpt" class="tp-input" rows="3"
                    placeholder="Tóm tắt ngắn gọn nội dung bài viết..."></textarea>
            </div>

            <div style="margin-bottom:20px">
                <label
                    style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">Ảnh
                    Thumbnail</label>
                <div style="display:flex;gap:12px">
                    <input type="text" id="p-thumb" class="tp-input" placeholder="URL ảnh..." style="flex:1">
                    <label class="tp-btn-ghost"
                        style="padding:10px 16px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:13px">
                        <i class="fa-solid fa-upload"></i> Tải ảnh
                        <input type="file" id="thumb-upload" style="display:none" accept="image/*"
                            onchange="uploadThumb(this)">
                    </label>
                </div>
                <div id="thumb-preview" style="margin-top:12px;display:none">
                    <img id="p-thumb-img" src=""
                        style="max-height:150px;border-radius:12px;border:1px solid var(--border)">
                </div>
            </div>

            <div style="margin-bottom:24px">
                <label
                    style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">Nội
                    dung HTML</label>
                <textarea id="p-content" class="tp-input" rows="18"
                    placeholder="<h2>Tiêu đề mục</h2><p>Nội dung đoạn văn...</p>"
                    style="font-family:monospace;font-size:13px"></textarea>
            </div>

            <div
                style="display:flex;gap:12px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:20px">
                <button onclick="window.location.href='admin.html'" class="tp-btn-ghost">Hủy</button>
                <button onclick="savePost()" class="tp-btn" id="save-btn"><i class="fa-solid fa-check"
                        style="margin-right:8px"></i>Lưu bài viết</button>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="common.js"></script>
    <script src="write.js"></script>
</body>

</html>
