<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang | TechPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 30% 20%, rgba(14, 116, 144, .18) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 70% 80%, rgba(168, 85, 247, .12) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .err-code {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(100px, 20vw, 180px);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--cyan), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {

            0%,
            100% {
                text-shadow: none;
            }

            20% {
                text-shadow: -3px 0 #ef4444, 3px 0 var(--cyan);
            }

            22% {
                text-shadow: none;
            }

            40% {
                text-shadow: 3px 0 #a855f7, -3px 0 #22d3ee;
            }

            42% {
                text-shadow: none;
            }
        }

        .pulse-ring {
            position: absolute;
            inset: -24px;
            border: 1px solid rgba(34, 211, 238, .15);
            border-radius: 50%;
            animation: pulse 3s ease-out infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(.9);
                opacity: 1;
            }

            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        .content {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="content">
        <div style="position:relative;display:inline-block;margin-bottom:8px">
            <div class="pulse-ring"></div>
            <div class="pulse-ring" style="animation-delay:.8s"></div>
            <div class="err-code">404</div>
        </div>

        <h1 class="outfit" style="font-size:clamp(1.2rem,3vw,1.8rem);font-weight:700;color:#fff;margin-bottom:12px">
            Trang không tồn tại
        </h1>
        <p style="font-size:15px;color:var(--text-muted);max-width:400px;margin:0 auto 36px;line-height:1.7">
            Trang bạn tìm kiếm đã bị xóa, đổi tên hoặc tạm thời không khả dụng.
        </p>

        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
            <a href="index.html" class="tp-btn"
                style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;padding:12px 24px">
                <i class="fa-solid fa-house"></i> Trang chủ
            </a>
            <button onclick="history.back()" class="tp-btn-ghost"
                style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </button>
        </div>

        <div style="margin-top:48px">
            <a href="index.html" class="outfit" style="font-size:20px;font-weight:800;text-decoration:none">
                <span style="color:var(--cyan)">Tech</span><span style="color:#fff">Pulse</span>
            </a>
        </div>
    </div>
</body>

</html>
