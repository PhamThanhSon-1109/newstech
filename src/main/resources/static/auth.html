<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPulse - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(14, 116, 144, .22) 0%, transparent 70%);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .tab-btn {
            padding: 10px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            border: none;
            font-family: 'Outfit', sans-serif;
        }

        .tab-btn.active {
            background: var(--cyan);
            color: #000;
        }

        .tab-btn:not(.active) {
            background: transparent;
            color: var(--text-muted);
        }

        .tab-btn:not(.active):hover {
            color: var(--text);
        }

        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
        }

        .eye-btn:hover {
            color: var(--text);
        }

        .input-wrap {
            position: relative;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <!-- Logo -->
        <div style="text-align:center;margin-bottom:32px">
            <a href="index.html" class="outfit" style="font-size:28px;font-weight:800;text-decoration:none">
                <span style="color:var(--cyan)">Tech</span><span style="color:var(--text)">Pulse</span>
            </a>
            <p style="font-size:13px;color:var(--text-muted);margin-top:8px">Tin tức công nghệ hàng đầu Việt Nam</p>
        </div>

        <!-- Card -->
        <div class="card rounded-3xl" style="padding:36px">

            <!-- Tabs -->
            <div
                style="display:flex;gap:4px;background:var(--surface-alt);border-radius:14px;padding:4px;margin-bottom:28px">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')" style="flex:1">Dang
                    nhap</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')" style="flex:1">Dang
                    ky</button>
            </div>

            <!-- LOGIN FORM -->
            <div id="form-login">
                <div style="display:flex;flex-direction:column;gap:14px">
                    <div>
                        <label
                            style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Ten
                            dang nhap</label>
                        <div class="input-wrap">
                            <input id="l-username" type="text" class="tp-input" placeholder="Nhập tên đăng nhập...">
                            <i class="fa-regular fa-user"
                                style="position:absolute;left:14px;top:14px;color:var(--text-muted);font-size:13px;display:none"></i>
                        </div>
                    </div>
                    <div>
                        <label
                            style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Mat
                            khau</label>
                        <div class="input-wrap">
                            <input id="l-password" type="password" class="tp-input" placeholder="Nhập mật khẩu...">
                            <button class="eye-btn" onclick="togglePwd('l-password',this)"><i
                                    class="fa-regular fa-eye"></i></button>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px">
                        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-muted)">
                            <input type="checkbox" id="remember"
                                style="accent-color:var(--cyan);width:15px;height:15px"> Ghi nhớ đăng nhập
                        </label>
                        <a href="#" style="color:var(--cyan);text-decoration:none;font-size:12px">Quên mật khẩu?</a>
                    </div>
                    <button class="tp-btn" id="login-btn" onclick="doLogin()"
                        style="width:100%;margin-top:4px;padding:14px">
                        <i class="fa-solid fa-right-to-bracket" style="margin-right:8px"></i> Đăng nhập
                    </button>
                </div>

                <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
                    Chưa có tài khoản? <a href="#" onclick="switchTab('register')"
                        style="color:var(--cyan);text-decoration:none;font-weight:600">Đăng ký ngay</a>
                </div>

                <!-- Social -->
                <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:20px">
                    <p
                        style="text-align:center;font-size:11px;color:var(--text-muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em">
                        Hoặc đăng nhập với</p>
                    <div style="display:flex;gap:10px">
                        <button onclick="showToast('Tính năng đang phát triển!','error')"
                            style="flex:1;padding:10px;background:var(--surface-alt);border:1px solid var(--border);border-radius:12px;cursor:pointer;color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:'DM Sans',sans-serif"
                            onmouseover="this.style.borderColor='var(--cyan)'; this.style.color='var(--cyan)'"
                            onmouseout="this.style.borderColor='var(--border)'; this.style.color='var(--text)'">
                            <i class="fa-brands fa-google" style="color:#ea4335"></i> Google
                        </button>
                        <button onclick="showToast('Tính năng đang phát triển!','error')"
                            style="flex:1;padding:10px;background:var(--surface-alt);border:1px solid var(--border);border-radius:12px;cursor:pointer;color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:'DM Sans',sans-serif"
                            onmouseover="this.style.borderColor='var(--cyan)'; this.style.color='var(--cyan)'"
                            onmouseout="this.style.borderColor='var(--border)'; this.style.color='var(--text)'">
                            <i class="fa-brands fa-github"></i> GitHub
                        </button>
                    </div>
                </div>
            </div>

            <!-- REGISTER FORM -->
            <div id="form-register" style="display:none">
                <div style="display:flex;flex-direction:column;gap:14px">
                    <div>
                        <label
                            style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Ten
                            dang nhap</label>
                        <input id="r-username" type="text" class="tp-input" placeholder="Chọn tên đăng nhập...">
                    </div>
                    <div>
                        <label
                            style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Mat
                            khau</label>
                        <div class="input-wrap">
                            <input id="r-password" type="password" class="tp-input" placeholder="Tạo mật khẩu mạnh...">
                            <button class="eye-btn" onclick="togglePwd('r-password',this)"><i
                                    class="fa-regular fa-eye"></i></button>
                        </div>
                    </div>
                    <div>
                        <label
                            style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Xac
                            nhan mat khau</label>
                        <div class="input-wrap">
                            <input id="r-confirm" type="password" class="tp-input" placeholder="Nhập lại mật khẩu...">
                            <button class="eye-btn" onclick="togglePwd('r-confirm',this)"><i
                                    class="fa-regular fa-eye"></i></button>
                        </div>
                    </div>

                    <!-- Password strength -->
                    <div id="pwd-strength" style="display:none">
                        <div
                            style="height:3px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:-6px">
                            <div id="strength-bar" style="height:100%;width:0;border-radius:99px;transition:all .3s">
                            </div>
                        </div>
                        <p id="strength-label" style="font-size:11px;margin-top:4px;color:var(--text-muted)"></p>
                    </div>

                    <button class="tp-btn" id="register-btn" onclick="doRegister()"
                        style="width:100%;margin-top:4px;padding:14px">
                        <i class="fa-solid fa-user-plus" style="margin-right:8px"></i> Tạo tài khoản
                    </button>
                </div>
                <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
                    Đã có tài khoản? <a href="#" onclick="switchTab('login')"
                        style="color:var(--cyan);text-decoration:none;font-weight:600">Đăng nhập</a>
                </div>
            </div>

        </div>

        <!-- Back link -->
        <div style="text-align:center;margin-top:20px">
            <a href="index.html"
                style="font-size:13px;color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:color .2s"
                onmouseover="this.style.color='var(--cyan)'" onmouseout="this.style.color='var(--text-muted)'">
                <i class="fa-solid fa-arrow-left"></i> Quay về trang chủ
            </a>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="auth.js"></script>
    <!-- All logic is in auth.js -->
</body>

</html>
